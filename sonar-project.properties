sonar.projectKey=leanmaga_PolleriaPatagonia
sonar.organization=leanmaga

# Información del proyecto
sonar.projectName=PolleriaPatagonia
sonar.projectVersion=1.0

# Carpetas a analizar
sonar.sources=app,src,components,lib
sonar.tests=__tests__

# Patrones de test
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx

# Exclusiones
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/public/**,**/coverage/**,.next/**

# ✅ COVERAGE - Ruta del reporte LCOV
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Configuración
sonar.sourceEncoding=UTF-8